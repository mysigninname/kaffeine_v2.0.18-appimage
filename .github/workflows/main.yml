name: Kaffeine AppImage (sharun) - kaffeine 2.0.18

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Install build tools + appimage prerequisites
        run: |
          /bin/sh -euxc '
            pacman-key --init || true
            pacman-key --populate archlinux || true
            pacman -Syu --noconfirm --needed

            pacman -S --noconfirm --needed \
              git ninja base-devel gcc \
              qt5-base qt5-multimedia qt5-svg \
              extra-cmake-modules \
              python3 \
              vlc \
              pipewire-pulse pipewire-jack \
              plasma-desktop \
              kcoreaddons5 ki18n5 kconfigwidgets5 kdbusaddons5 kio5 kxmlgui5 kwindowsystem kcmutils kiconthemes kwallet \
              kio-extras \
              sonnet threadweaver \
              breeze-icons oxygen-icons \
              attica baloo bluez-qt \
              solid \
              libxss \
              patchelf \
              fuse2fs squashfs-tools wget curl tar gzip bzip2 unzip xz \
              xorg-xvfb
          '

      - name: Install CMake (3.25.3)
        run: |
          /bin/sh -euxc '
            cd /tmp
            CMAKE_VER=3.25.3
            CMAKE_TGZ="cmake-${CMAKE_VER}-linux-x86_64.tar.gz"

            curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/${CMAKE_TGZ}"
            tar -xzf "${CMAKE_TGZ}"

            rm -rf /opt/cmake
            mv "cmake-${CMAKE_VER}-linux-x86_64" /opt/cmake

            mkdir -p /usr/local/bin
            ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake
            ln -sf /opt/cmake/bin/ctest /usr/local/bin/ctest
            ln -sf /opt/cmake/bin/cpack /usr/local/bin/cpack
            ln -sf /opt/cmake/bin/ccmake /usr/local/bin/ccmake

            /usr/local/bin/cmake --version
          '

      - name: Checkout kaffeine v2.0.18 (tag)
        run: |
          /bin/sh -euxc '
            rm -rf /src/kaffeine
            mkdir -p /src
            git clone --no-tags https://invent.kde.org/multimedia/kaffeine.git /src/kaffeine
            cd /src/kaffeine
            git fetch --tags --force
            git checkout -f v2.0.18
            git describe --tags --always
          '

      - name: Build from source and stage
        run: |
          /bin/sh -euxc '
            cd /src/kaffeine

            rm -rf build /tmp/kaffeine-root
            /usr/local/bin/cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX=/usr

            ninja -C build
            DESTDIR=/tmp/kaffeine-root ninja -C build install

            test -x /tmp/kaffeine-root/usr/bin/kaffeine || (ls -la /tmp/kaffeine-root/usr/bin && exit 1)
          '

      - name: Build AppImage using quick-sharun
        run: |
          /bin/sh -euxc '
            cd /tmp
            rm -rf appimage-work
            mkdir -p appimage-work

            cp -a /tmp/kaffeine-root/usr appimage-work/

            cd appimage-work

            curl -fsSL "https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh" -o ./quick-sharun
            chmod +x ./quick-sharun

            APP_BIN="./usr/bin/kaffeine"
            test -x "$APP_BIN" || { echo "Missing $APP_BIN"; exit 1; }

            DESKTOP_FILE="$(find ./usr/share/applications -maxdepth 1 -type f -iname "*kaffeine*.desktop" | head -n 1 || true)"
            test -n "$DESKTOP_FILE" || { echo "No top level .desktop file found in ./usr/share/applications"; ls -ლა ./usr/share/applications || true; exit 1; }

            ICON_FILE="$(find ./usr/share/icons -type f -path "*/*apps/*kaffeine*" | head -n 1 || true)"

            OUTPATH="/tmp/appimage-work/dist"
            mkdir -p "$OUTPATH"

            ./quick-sharun "$APP_BIN" \
              --make-appimage \
              --outpath "$OUTPATH" \
              --outname "Kaffeine-2.0.18-x86_64.AppImage" \
              --desktop-file "$DESKTOP_FILE" \
              ${ICON_FILE:+--icon "$ICON_FILE"}

            ls -la /tmp/appimage-work/dist
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AppImage-x86_64-kaffeine-2.0.18
          path: /tmp/appimage-work/dist
          if-no-files-found: error

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create stable release
        uses: pkgforge-dev/make-stable-appimage-release@v1
