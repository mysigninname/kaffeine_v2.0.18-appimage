name: Kaffeine AppImage (sharun) - v2.0.18

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Checkout kaffeine-AppImage build scripts
        uses: actions/checkout@v5
        with:
          repository: pkgforge-dev/kaffeine-AppImage
          ref: main
          path: build-scripts

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@v2

      - name: Build AppImage (sharun)
        working-directory: build-scripts
        env:
          KAFFEINE_VERSION: v2.0.18
        run: |
          /bin/sh ./get-dependencies.sh
          /bin/sh ./make-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AppImage-x86_64
          path: build-scripts/dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create stable release
        uses: pkgforge-dev/make-stable-appimage-release@v1
