name: Kaffeine AppImage (sharun) - kaffeine 2.0.18

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Install minimal tools (git/cmake/ninja)
        run: |
          /bin/sh -euxc '
            pacman-key --init || true
            pacman-key --populate archlinux || true
            pacman -Syu --noconfirm --needed

            pacman -S --noconfirm --needed \
              git cmake ninja base-devel
          '

      - name: Checkout kaffeine-AppImage helper repo
        uses: actions/checkout@v5
        with:
          repository: pkgforge-dev/kaffeine-AppImage
          ref: main
          path: appimage-helper

      - name: Checkout kaffeine v2.0.18
        run: |
          /bin/sh -euxc '
            git clone --depth 1 --branch v2.0.18 https://invent.kde.org/multimedia/kaffeine.git /src/kaffeine
          '

      - name: Install KDE/Qt build dependencies
        run: |
          /bin/sh -euxc '
            pacman -S --noconfirm --needed \
              extra-cmake-modules kcoreaddons \
              qt6-base qt6-multimedia qt6-svg \
              attica baloo bluez-qt calendarcore contacts frameworkintegration guiaddons iconthemes kcmutils kio kio-plugins solid sonnet threadweaver xmlgui wallet \
              breeze-icons oxygen-icons \
              python3 \
              pipewire wireplumber \
              vlc
          '

      - name: Build and install kaffeine into a staging root
        run: |
          /bin/sh -euxc '
            cd /src/kaffeine

            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX=/usr

            ninja -C build
            DESTDIR=/tmp/kaffeine-root ninja -C build install
          '

      - name: Build AppImage with sharun
        run: |
          /bin/sh -euxc '
            cd /appimage-helper

            # Reset any previous staging paths that the helper expects (if present)
            rm -rf /tmp/appdir /tmp/AppDir || true

            # Provide the staged /usr tree to the AppImage helper.
            # If the helper expects a different staging location/name, adjust as needed.
            cp -a /tmp/kaffeine-root/usr /usr || true

            /bin/sh ./get-dependencies.sh
            /bin/sh ./make-appimage.sh
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AppImage-x86_64-kaffeine-2.0.18
          path: appimage-helper/dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create stable release
        uses: pkgforge-dev/make-stable-appimage-release@v1
