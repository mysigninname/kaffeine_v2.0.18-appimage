name: Kaffeine AppImage (sharun) - kaffeine 2.0.18

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Install minimal tools (git/cmake/ninja)
        run: |
          /bin/sh -euxc '
            pacman-key --init || true
            pacman-key --populate archlinux || true
            pacman -Syu --noconfirm --needed

            pacman -S --noconfirm --needed \
              git cmake ninja base-devel
          '

      - name: Checkout kaffeine-AppImage helper repo
        uses: actions/checkout@v5
        with:
          repository: pkgforge-dev/kaffeine-AppImage
          ref: main
          path: appimage-helper

      - name: Checkout kaffeine v2.0.18
        run: |
          /bin/sh -euxc '
            rm -rf /src/kaffeine
            git clone --depth 1 --single-branch --branch v2.0.18 https://invent.kde.org/multimedia/kaffeine.git /src/kaffeine
          '

      - name: Install KF5 + KDE dependencies
        run: |
          /bin/sh -euxc '
            pacman -S --noconfirm --needed \
              extra-cmake-modules kcoreaddons \
              qt5-base qt5-multimedia qt5-svg \
              attica baloo bluez-qt \
              kcalendarcore kcontacts \
              kguiaddons kiconthemes \
              kcmutils kio kio-extras \
              kwindowsystem \
              solid sonnet threadweaver \
              kxmlgui kwallet \
              breeze-icons oxygen-icons \
              python3 \
              vlc \
              pipewire wireplumber
          '

      - name: Build and install kaffeine into a staging root
        run: |
          /bin/sh -euxc '
            cd /src/kaffeine

            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5

            ninja -C build
            DESTDIR=/tmp/kaffeine-root ninja -C build install
          '

      - name: Build AppImage with sharun
        run: |
          /bin/sh -euxc '
            cd /appimage-helper

            rm -rf /tmp/appdir /tmp/AppDir /tmp/usr || true
            mkdir -p /tmp/usr

            cp -a /tmp/kaffeine-root/usr /usr || true

            /bin/sh ./get-dependencies.sh
            /bin/sh ./make-appimage.sh
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AppImage-x86_64-kaffeine-2.0.18
          path: appimage-helper/dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create stable release
        uses: pkgforge-dev/make-stable-appimage-release@v1
