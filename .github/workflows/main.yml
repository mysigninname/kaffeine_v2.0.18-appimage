name: Kaffeine AppImage (sharun) - kaffeine 2.0.18

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Install build tools + runtime packagers
        run: |
          /bin/sh -euxc '
            pacman-key --init || true
            pacman-key --populate archlinux || true
            pacman -Syu --noconfirm --needed

            pacman -S --noconfirm --needed \
              git ninja base-devel gcc \
              qt5-base qt5-multimedia qt5-svg \
              extra-cmake-modules \
              python3 \
              vlc \
              pipewire-pulse pipewire-jack \
              plasma-desktop \
              kcoreaddons5 ki18n5 kconfigwidgets5 kdbusaddons5 kio5 kxmlgui5 kwindowsystem kcmutils kiconthemes kwallet \
              kio-extras \
              sonnet threadweaver \
              breeze-icons oxygen-icons \
              attica baloo bluez-qt \
              solid \
              libxss \
              patchelf \
              fuse2fs squashfs-tools wget curl tar gzip bzip2 unzip xz
          '

      - name: Install CMake (3.25.3)
        run: |
          /bin/sh -euxc '
            cd /tmp
            CMAKE_VER=3.25.3
            CMAKE_TGZ="cmake-${CMAKE_VER}-linux-x86_64.tar.gz"

            curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/${CMAKE_TGZ}"
            tar -xzf "${CMAKE_TGZ}"

            rm -rf /opt/cmake
            mv "cmake-${CMAKE_VER}-linux-x86_64" /opt/cmake

            mkdir -p /usr/local/bin
            ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake
            ln -sf /opt/cmake/bin/ctest /usr/local/bin/ctest
            ln -sf /opt/cmake/bin/cpack /usr/local/bin/cpack
            ln -sf /opt/cmake/bin/ccmake /usr/local/bin/ccmake

            /usr/local/bin/cmake --version
          '

      - name: Checkout kaffeine-AppImage helper repo
        uses: actions/checkout@v5
        with:
          repository: pkgforge-dev/kaffeine-AppImage
          ref: main
          path: appimage-helper

      - name: Checkout kaffeine v2.0.18 (tag)
        run: |
          /bin/sh -euxc '
            rm -rf /src/kaffeine
            mkdir -p /src
            git clone --no-tags https://invent.kde.org/multimedia/kaffeine.git /src/kaffeine
            cd /src/kaffeine
            git fetch --tags --force
            git checkout -B v2.0.18 v2.0.18 || git checkout -B v2.0.18 2.0.18
          '

      - name: Build and install kaffeine into a staging root
        run: |
          /bin/sh -euxc '
            cd /src/kaffeine

            /usr/local/bin/cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX=/usr

            ninja -C build
            DESTDIR=/tmp/kaffeine-root ninja -C build install
          '

      - name: Build AppImage with sharun (fix missing quick-sharun + patchelf)
        run: |
          /bin/sh -euxc '
            cd appimage-helper

            rm -rf /tmp/appdir /tmp/AppDir /tmp/usr || true
            mkdir -p /tmp/usr

            cp -a /tmp/kaffeine-root/usr /usr || true

            # quick-sharun
            SHARUN_URL="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh"
            curl -fsSL "$SHARUN_URL" -o ./quick-sharun
            chmod +x ./quick-sharun
            ln -sf "$PWD/quick-sharun" /usr/local/bin/quick-sharun

            # If helper tries to call get-debloated-pkgs, neutralize it
            if [ -f ./get-dependencies.sh ]; then
              sed -i -e "s/^[[:space:]]*get-debloated-pkgs[[:space:]].*/echo \"Skipping debloated packages (get-debloated-pkgs not available)\"/g" ./get-dependencies.sh
            fi

            /bin/sh ./get-dependencies.sh

            # Assert patchelf exists for make-appimage.sh
            command -v patchelf
            patchelf --version

            /bin/sh ./make-appimage.sh
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AppImage-x86_64-kaffeine-2.0.18
          path: appimage-helper/dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create stable release
        uses: pkgforge-dev/make-stable-appimage-release@v1
