name: Kaffeine AppImage (sharun) - kaffeine 2.0.18

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Install build tools
        run: |
          /bin/sh -euxc '
            pacman-key --init || true
            pacman-key --populate archlinux || true
            pacman -Syu --noconfirm --needed

            pacman -S --noconfirm --needed \
              git ninja base-devel gcc \
              qt5-base qt5-multimedia qt5-svg \
              extra-cmake-modules kcoreaddons \
              attica baloo bluez-qt \
              solid threadweaver sonnet \
              kio kio-extras \
              kxmlgui kwallet \
              kconfigwidgets \
              breeze-icons oxygen-icons \
              python3 \
              vlc \
              pipewire wireplumber
          '

      - name: Install CMake (older to allow CMP0002 OLD)
        run: |
          /bin/sh -euxc '
            cd /tmp
            CMAKE_VER=3.25.3
            curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz"
            tar -xzf "cmake-${CMAKE_VER}-linux-x86_64.tar.gz"
            rm -f /usr/local/bin/cmake /usr/local/bin/ctest /usr/local/bin/cpack /usr/local/bin/ccmake || true
            cp -a "cmake-${CMAKE_VER}-linux-x86_64/"*/bin/* /usr/local/bin/
            /usr/local/bin/cmake --version
          '

      - name: Checkout kaffeine-AppImage helper repo
        uses: actions/checkout@v5
        with:
          repository: pkgforge-dev/kaffeine-AppImage
          ref: main
          path: appimage-helper

      - name: Checkout kaffeine v2.0.18
        run: |
          /bin/sh -euxc '
            rm -rf /src/kaffeine
            git clone --depth 1 --single-branch --branch v2.0.18 https://invent.kde.org/multimedia/kaffeine.git /src/kaffeine
          '

      - name: Install KDE/Qt5/KF5 runtime deps (broad)
        run: |
          /bin/sh -euxc '
            pacman -S --noconfirm --needed \
              plasma-desktop \
              kf5-frameworkintegration \
              kf5-kio kf5-solid kf5-xmlgui kf5-kwallet kf5-wallet \
              kf5-kconfigwidgets kf5-kwindowsystem \
              kf5-kiconthemes kf5-kguiaddons \
              kf5-kcmutils kf5-sonnet kf5-threadweaver \
              kf5-kdbusaddons
          ' || true

      - name: Build and install kaffeine into a staging root
        run: |
          /bin/sh -euxc '
            cd /src/kaffeine

            /usr/local/bin/cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX=/usr

            ninja -C build
            DESTDIR=/tmp/kaffeine-root ninja -C build install
          '

      - name: Build AppImage with sharun
        run: |
          /bin/sh -euxc '
            cd /appimage-helper

            rm -rf /tmp/appdir /tmp/AppDir /tmp/usr || true
            mkdir -p /tmp/usr

            cp -a /tmp/kaffeine-root/usr /usr || true

            /bin/sh ./get-dependencies.sh
            /bin/sh ./make-appimage.sh
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AppImage-x86_64-kaffeine-2.0.18
          path: appimage-helper/dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create stable release
        uses: pkgforge-dev/make-stable-appimage-release@v1
