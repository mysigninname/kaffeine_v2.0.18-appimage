name: Kaffeine AppImage (sharun) - kaffeine 2.0.18

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Install minimal tools (git/cmake/ninja)
        run: |
          /bin/sh -euxc '
            pacman-key --init || true
            pacman-key --populate archlinux || true
            pacman -Syu --noconfirm --needed
            pacman -S --noconfirm --needed git cmake ninja base-devel
          '

      - name: Checkout kaffeine-AppImage helper repo
        uses: actions/checkout@v5
        with:
          repository: pkgforge-dev/kaffeine-AppImage
          ref: main
          path: appimage-helper

      - name: Checkout kaffeine v2.0.18
        run: |
          /bin/sh -euxc '
            rm -rf /src/kaffeine
            git clone --depth 1 --single-branch --branch v2.0.18 https://invent.kde.org/multimedia/kaffeine.git /src/kaffeine
          '

      - name: Install KDE/Qt build dependencies (auto-resolve package names)
        run: |
          /bin/sh -euxc '
            resolve_and_install () {
              name="$1"
              pkg=""
              if pacman -Si "$name" >/dev/null 2>&1; then
                pkg="$name"
              else
                # Try common variants (KF5/KF6/renames) by searching repo for close matches
                for cand in "${name}5" "${name}6" "extra/${name}5" "extra/${name}6"; do
                  if pacman -Si "$cand" >/dev/null 2>&1; then
                    pkg="$cand"
                    break
                  fi
                done
              fi

              if [ -n "$pkg" ]; then
                pacman -S --noconfirm --needed "$pkg"
              else
                echo "SKIP (not found): $name"
              fi
            }

            pacman -S --noconfirm --needed \
              extra-cmake-modules kcoreaddons \
              qt5-base qt5-multimedia qt5-svg \
              attica baloo bluez-qt \
              kcmutils kio kio-extras \
              solid sonnet threadweaver \
              kxmlgui kwallet \
              breeze-icons oxygen-icons \
              python3 vlc pipewire wireplumber

            # Resolve the rest by installing any repo package that matches the known base names.
            # (This avoids hardcoding names like kcalendarcore5 which may be absent in this container.)
            for base in \
              kcalendarcore kcontacts kguiaddons kiconthemes kdbusaddons ksolid \
              kwindowsystem kxmlgui kwallet kconfigwidgets; do
              resolve_and_install "$base"
            done
          '

      - name: Build and install kaffeine into a staging root
        run: |
          /bin/sh -euxc '
            cd /src/kaffeine
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_POLICY_DEFAULT_CMP0002=NEW \
              -Wno-dev

            ninja -C build
            DESTDIR=/tmp/kaffeine-root ninja -C build install
          '

      - name: Build AppImage with sharun
        run: |
          /bin/sh -euxc '
            cd /appimage-helper

            rm -rf /tmp/appdir /tmp/AppDir /tmp/usr || true
            mkdir -p /tmp/usr

            cp -a /tmp/kaffeine-root/usr /usr || true

            /bin/sh ./get-dependencies.sh
            /bin/sh ./make-appimage.sh
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AppImage-x86_64-kaffeine-2.0.18
          path: appimage-helper/dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Create stable release
        uses: pkgforge-dev/make-stable-appimage-release@v1
