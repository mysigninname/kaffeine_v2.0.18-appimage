name: Kaffeine AppImage (sharun) - kaffeine 2.0.18

on:
  workflow\_dispatch: {}

      
      - name: Build AppImage using quick-sharun
        run: |
          /bin/sh -euxc '
            cd /tmp
            rm -rf appimage-work
            mkdir -p appimage-work

            cp -a /tmp/kaffeine-root/usr appimage-work/

            cd appimage-work

            curl -fsSL "https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh" \
              -o ./quick-sharun
            chmod +x ./quick-sharun

            APP_BIN="./usr/bin/kaffeine"
            test -x "$APP_BIN"

            DESKTOP_FILE="$(find ./usr/share/applications \
              -maxdepth 1 \
              -type f \
              -iname "*kaffeine*.desktop" \
              -print -quit)"

            test -n "$DESKTOP_FILE"
            cp -f "$DESKTOP_FILE" "$DESKTOP_FILE.bak"

            sed -i \
              -e "s|^Exec=.*/kaffeine.*|Exec=kaffeine %U|g" \
              -e "s|^Exec=kaffeine %U %U$|Exec=kaffeine %U|g" \
              "$DESKTOP_FILE"

            ICON_FILE="$(find ./usr/share/icons \
              -type f \
              -iname "*kaffeine*.png" \
              -print -quit || true)"

            if [ -z "$ICON_FILE" ]; then
              ICON_FILE="$(find ./usr/share/icons \
                -type f \
                -iname "*kaffeine*.svg" \
                -print -quit || true)"
            fi

            export DESKTOP="$DESKTOP_FILE"

            if [ -n "$ICON_FILE" ]; then
              export ICON="$ICON_FILE"
            else
              export ICON="DUMMY"
            fi

            export OUTPATH="/tmp/appimage-work/dist"
            export OUTNAME="Kaffeine-2.0.18-x86_64.AppImage"
            mkdir -p "$OUTPATH"

            echo "Deploying application into AppDir:"
            ./quick-sharun "$APP_BIN"

            echo "Platform and SQLite plugins in AppDir:"
            find AppDir -type f \
              \( \
                -name "libqxcb.so" -o \
                -name "libqwayland*.so" -o \
                -name "libqsqlite.so" \
              \) \
              -print || true

            echo "Building AppImage:"
            ./quick-sharun --make-appimage

            echo "Testing the generated AppImage:"
            ./quick-sharun --simple-test "$OUTPATH/$OUTNAME"

            echo "Files in final AppImage:"
            FINAL_APPIMAGE="$OUTPATH/$OUTNAME"
            test -f "$FINAL_APPIMAGE"

            rm -rf /tmp/final-appimage-check
            mkdir -p /tmp/final-appimage-check
            cd /tmp/final-appimage-check

            "$FINAL_APPIMAGE" --appimage-extract \
              >/tmp/final-appimage-extract.log 2>&1

            find squashfs-root -type f \
              \( \
                -name "libqxcb.so" -o \
                -name "libqwayland*.so" -o \
                -name "libqsqlite.so" \
              \) \
              -print || true

            echo "AppImage extraction log:"
            cat /tmp/final-appimage-extract.log || true

            echo "Generated files:"
            ls -la "$OUTPATH"
          '
